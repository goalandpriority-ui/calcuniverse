<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalcUniverse</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #080810;
  --surface: #0f0f1a;
  --card: #14141f;
  --border: #1e1e30;
  --text: #eeeeff;
  --muted: #666688;
}

body {
  background: var(--bg);
  font-family: 'Outfit', sans-serif;
  color: var(--text);
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}
.hero h1 {
  font-family: 'Bebas Neue';
  font-size: 4rem;
  background: linear-gradient(135deg,#fff,#a78bfa,#06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  color: var(--muted);
  margin-top: 10px;
}

/* LAYOUT */
.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  max-width: 1100px;
  margin: auto;
}

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 20px;
}

.nav-item {
  padding: 10px;
  cursor: pointer;
  border-radius: 8px;
  color: var(--muted);
}
.nav-item:hover { background: #ffffff10; color: #fff; }
.nav-item.active { background: #14141f; color: #fff; }

/* CONTENT */
.content {
  padding: 30px;
}

.calc-panel { display: none; }
.calc-panel.active { display: block; }

/* INPUT */
input, select {
  width: 100%;
  padding: 10px;
  background: #111;
  border: 1px solid #222;
  color: #fff;
  margin-bottom: 10px;
  border-radius: 8px;
}

/* BUTTON */
button {
  padding: 12px;
  width: 100%;
  border: none;
  background: #7c3aed;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* RESULT */
.result {
  margin-top: 15px;
  font-size: 1.2rem;
}
</style>
</head>

<body>

<div class="hero">
  <h1>CalcUniverse</h1>
  <p>All-in-one calculator app</p>
</div>

<div class="app">

<div class="sidebar" id="sidebar"></div>

<div class="content">
  <!-- EMI -->
<div class="calc-panel" id="p-emi">
  <h2>EMI Calculator</h2>

  <input id="emi-p" type="number" placeholder="Loan Amount (₹)" value="500000">
  <input id="emi-r" type="number" placeholder="Interest Rate (%)" value="8.5">
  <input id="emi-t" type="number" placeholder="Years" value="20">

  <button onclick="calcEMI()">Calculate EMI</button>

  <div class="result" id="r-emi"></div>
</div>

<!-- SIP -->
<div class="calc-panel" id="p-sip">
  <h2>SIP Calculator</h2>

  <input id="sip-m" type="number" placeholder="Monthly Investment" value="5000">
  <input id="sip-r" type="number" placeholder="Return %" value="12">
  <input id="sip-t" type="number" placeholder="Years" value="10">

  <button onclick="calcSIP()">Calculate Returns</button>

  <div class="result" id="r-sip"></div>
</div>

<!-- LOAN INTEREST -->
<div class="calc-panel" id="p-loan">
  <h2>Loan Interest</h2>

  <input id="li-p" type="number" placeholder="Principal" value="100000">
  <input id="li-r" type="number" placeholder="Rate %" value="10">
  <input id="li-t" type="number" placeholder="Years" value="3">

  <select id="li-type">
    <option value="s">Simple</option>
    <option value="c">Compound</option>
  </select>

  <button onclick="calcLI()">Calculate</button>

  <div class="result" id="r-loan"></div>
</div>
<!-- GST CALCULATOR -->
<div class="calc-panel" id="p-gst">
  <h2>GST Calculator</h2>

  <input id="gst-a" type="number" placeholder="Amount (₹)" value="1000">

  <select id="gst-r">
    <option value="5">5%</option>
    <option value="12">12%</option>
    <option value="18" selected>18%</option>
    <option value="28">28%</option>
  </select>

  <select id="gst-m">
    <option value="add">Add GST</option>
    <option value="rem">Remove GST</option>
  </select>

  <button onclick="calcGST()">Calculate GST</button>

  <div class="result" id="r-gst"></div>
</div>


<!-- INCOME TAX -->
<div class="calc-panel" id="p-tax">
  <h2>Income Tax (India)</h2>

  <input id="tx-inc" type="number" placeholder="Annual Income" value="800000">

  <select id="tx-reg">
    <option value="new">New Regime</option>
    <option value="old">Old Regime</option>
  </select>

  <input id="tx-ded" type="number" placeholder="Deductions (Old regime only)" value="150000">

  <button onclick="calcTax()">Calculate Tax</button>

  <div class="result" id="r-tax"></div>
</div>


<!-- LOAN ELIGIBILITY -->
<div class="calc-panel" id="p-eligibility">
  <h2>Loan Eligibility</h2>

  <input id="el-inc" type="number" placeholder="Monthly Income" value="60000">
  <input id="el-emi" type="number" placeholder="Existing EMI" value="0">
  <input id="el-r" type="number" placeholder="Interest Rate %" value="8.5">
  <input id="el-t" type="number" placeholder="Years" value="20">

  <button onclick="calcElig()">Check Eligibility</button>

  <div class="result" id="r-elig"></div>
</div>
<!-- BMI CALCULATOR -->
<div class="calc-panel" id="p-bmi">
  <h2>BMI Calculator</h2>

  <input id="bmi-h" type="number" placeholder="Height (cm)" value="170">
  <input id="bmi-w" type="number" placeholder="Weight (kg)" value="70">

  <button onclick="calcBMI()">Calculate BMI</button>

  <div class="result" id="r-bmi"></div>
</div>


<!-- AGE CALCULATOR -->
<div class="calc-panel" id="p-age">
  <h2>Age Calculator</h2>

  <input id="age-dob" type="date">

  <button onclick="calcAge()">Calculate Age</button>

  <div class="result" id="r-age"></div>
</div>


<!-- LOVE COMPATIBILITY -->
<div class="calc-panel" id="p-love">
  <h2>Love Calculator ❤️</h2>

  <input id="love1" type="text" placeholder="Your Name">
  <input id="love2" type="text" placeholder="Partner Name">

  <button onclick="calcLove()">Check Love %</button>

  <div class="result" id="r-love"></div>
</div>
<!-- YOUTUBE MONEY -->
<div class="calc-panel" id="p-yt">
  <h2>YouTube Earnings 💰</h2>

  <input id="yt-views" type="number" placeholder="Monthly Views" value="100000">
  <input id="yt-cpm" type="number" placeholder="CPM ($ per 1000 views)" value="2">

  <button onclick="calcYT()">Calculate Earnings</button>

  <div class="result" id="r-yt"></div>
</div>


<!-- INSTAGRAM EARNINGS -->
<div class="calc-panel" id="p-ig">
  <h2>Instagram Earnings 📸</h2>

  <input id="ig-followers" type="number" placeholder="Followers" value="10000">
  <input id="ig-eng" type="number" placeholder="Engagement (%)" value="5">

  <button onclick="calcIG()">Estimate Earnings</button>

  <div class="result" id="r-ig"></div>
</div>


<!-- AI API COST -->
<div class="calc-panel" id="p-ai">
  <h2>AI API Cost 🤖</h2>

  <input id="ai-tokens" type="number" placeholder="Tokens per request" value="1000">
  <input id="ai-req" type="number" placeholder="Requests per day" value="100">
  <input id="ai-price" type="number" placeholder="Cost per 1K tokens ($)" value="0.002">

  <button onclick="calcAI()">Calculate Cost</button>

  <div class="result" id="r-ai"></div>
</div>
<!-- STUDENT CALCULATOR -->
<div class="calc-panel" id="p-student">
  <h2>Student Calculator 🧮</h2>

  <div id="s-display" style="
    background:#111;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:right;
    font-size:1.5rem;
  ">0</div>

  <div style="
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  ">

    <!-- ROW 1 -->
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button onclick="press('/')">÷</button>

    <!-- ROW 2 -->
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('*')">×</button>

    <!-- ROW 3 -->
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('-')">−</button>

    <!-- ROW 4 -->
    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button onclick="calculate()">=</button>
    <button onclick="press('+')">+</button>

    <!-- ROW 5 -->
    <button onclick="clearDisplay()" style="grid-column:span 4; background:#f43f5e;">
      Clear
    </button>

  </div>
</div>
<script>
/* ───────────── SIDEBAR DATA ───────────── */
const CALCS = [
  {
    category: "Finance 💰",
    items: [
      { id: "p-emi", name: "EMI", emoji: "🏦" },
      { id: "p-sip", name: "SIP", emoji: "📈" },
      { id: "p-loan", name: "Loan Interest", emoji: "💳" },
      { id: "p-eligibility", name: "Eligibility", emoji: "🏠" }
    ]
  },
  {
    category: "Tax 🧾",
    items: [
      { id: "p-gst", name: "GST", emoji: "🧾" },
      { id: "p-tax", name: "Income Tax", emoji: "🇮🇳" }
    ]
  },
  {
    category: "Health 🧍",
    items: [
      { id: "p-bmi", name: "BMI", emoji: "⚖️" },
      { id: "p-age", name: "Age", emoji: "🎂" }
    ]
  },
  {
    category: "Fun ❤️",
    items: [
      { id: "p-love", name: "Love %", emoji: "❤️" }
    ]
  },
  {
    category: "Creator 📸",
    items: [
      { id: "p-yt", name: "YouTube Money", emoji: "💰" },
      { id: "p-ig", name: "Instagram", emoji: "📸" }
    ]
  },
  {
    category: "Tech 🤖",
    items: [
      { id: "p-ai", name: "AI Cost", emoji: "🤖" }
    ]
  },
  {
    category: "Utility 🧮",
    items: [
      { id: "p-student", name: "Student Calc", emoji: "🧮" }
    ]
  }
];

/* ───────────── BUILD SIDEBAR ───────────── */
const sidebar = document.getElementById("sidebar");

CALCS.forEach(cat => {
  const div = document.createElement("div");

  div.innerHTML = `
    <h3 style="margin-top:15px;color:#888;font-size:12px;">
      ${cat.category}
    </h3>
    ${cat.items.map(i => `
      <div class="nav-item" data-target="${i.id}">
        ${i.emoji} ${i.name}
      </div>
    `).join("")}
  `;

  sidebar.appendChild(div);
});

/* ───────────── NAV CLICK ───────────── */
document.querySelectorAll(".nav-item").forEach(item => {
  item.onclick = () => {
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    item.classList.add("active");

    document.querySelectorAll(".calc-panel").forEach(p => p.classList.remove("active"));
    document.getElementById(item.dataset.target).classList.add("active");
  };
});

/* DEFAULT OPEN */
document.querySelector(".nav-item")?.click();
</script>
<script>

/* ───────── EMI ───────── */
function calcEMI() {
  let P = +emi-p.value;
  let r = +emi-r.value / 12 / 100;
  let n = +emi-t.value * 12;

  let emi = (P*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);

  r_emi.innerText = "EMI: ₹ " + Math.round(emi);
}

/* ───────── SIP ───────── */
function calcSIP() {
  let m = +sip-m.value;
  let r = +sip-r.value / 12 / 100;
  let n = +sip-t.value * 12;

  let fv = m * ((Math.pow(1+r,n)-1)/r)*(1+r);

  r_sip.innerText = "Future Value: ₹ " + Math.round(fv);
}

/* ───────── LOAN ───────── */
function calcLI() {
  let P = +li-p.value;
  let r = +li-r.value / 100;
  let t = +li-t.value;

  let interest = li-type.value === "s"
    ? P*r*t
    : P*(Math.pow(1+r,t)-1);

  r_loan.innerText = "Interest: ₹ " + Math.round(interest);
}

/* ───────── GST ───────── */
function calcGST() {
  let a = +gst-a.value;
  let r = +gst-r.value/100;

  let res = gst-m.value === "add"
    ? a + (a*r)
    : a/(1+r);

  r_gst.innerText = "Result: ₹ " + Math.round(res);
}

/* ───────── TAX ───────── */
function calcTax() {
  let inc = +tx-inc.value;
  let tax = 0;

  if (inc > 300000) tax += (inc-300000)*0.05;

  tax *= 1.04;

  r_tax.innerText = "Tax: ₹ " + Math.round(tax);
}

/* ───────── ELIGIBILITY ───────── */
function calcElig() {
  let inc = +el-inc.value;
  let emi = +el-emi.value;

  let eligible = (inc*0.4 - emi) * 100;

  r_elig.innerText = "Eligible Loan: ₹ " + Math.round(eligible);
}

/* ───────── BMI ───────── */
function calcBMI() {
  let h = +bmi-h.value / 100;
  let w = +bmi-w.value;

  let bmi = w / (h*h);

  r_bmi.innerText = "BMI: " + bmi.toFixed(2);
}

/* ───────── AGE ───────── */
function calcAge() {
  let dob = new Date(age-dob.value);
  let now = new Date();

  let age = now.getFullYear() - dob.getFullYear();

  r_age.innerText = "Age: " + age;
}

/* ───────── LOVE ───────── */
function calcLove() {
  let a = love1.value.length;
  let b = love2.value.length;

  let score = (a * b) % 100;

  r_love.innerText = "Love: " + score + "% ❤️";
}

/* ───────── YOUTUBE ───────── */
function calcYT() {
  let views = +yt-views.value;
  let cpm = +yt-cpm.value;

  let earn = (views/1000)*cpm;

  r_yt.innerText = "$ " + earn.toFixed(2);
}

/* ───────── INSTAGRAM ───────── */
function calcIG() {
  let f = +ig-followers.value;
  let e = +ig-eng.value;

  let earn = (f * (e/100)) * 0.02;

  r_ig.innerText = "$ " + earn.toFixed(2);
}

/* ───────── AI COST ───────── */
function calcAI() {
  let t = +ai-tokens.value;
  let r = +ai-req.value;
  let p = +ai-price.value;

  let cost = (t/1000)*r*p*30;

  r_ai.innerText = "$ " + cost.toFixed(2) + " / month";
}

/* ───────── STUDENT CALC ───────── */
let exp = "";

function press(val) {
  exp += val;
  document.getElementById("s-display").innerText = exp;
}

function calculate() {
  try {
    exp = eval(exp).toString();
  } catch {
    exp = "Error";
  }
  document.getElementById("s-display").innerText = exp;
}

function clearDisplay() {
  exp = "";
  document.getElementById("s-display").innerText = "0";
}

</script>
<script>

/* ───────── AUTO FORMAT INPUT (no negative / clean) ───────── */
document.querySelectorAll("input").forEach(inp => {
  inp.addEventListener("input", () => {
    if (inp.type === "number" && inp.value < 0) {
      inp.value = 0;
    }
  });
});

/* ───────── ENTER KEY SUPPORT ───────── */
document.querySelectorAll("input").forEach(inp => {
  inp.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      const panel = this.closest(".calc-panel");
      panel.querySelector("button")?.click();
    }
  });
});

/* ───────── SMOOTH PANEL SWITCH ───────── */
document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
});

/* ───────── RESULT ANIMATION ───────── */
function animateResult(el) {
  el.style.opacity = 0;
  el.style.transform = "translateY(10px)";

  setTimeout(() => {
    el.style.transition = "all 0.3s ease";
    el.style.opacity = 1;
    el.style.transform = "translateY(0)";
  }, 50);
}

/* Hook animation to all results */
const oldSetText = (el, text) => {
  el.innerText = text;
  animateResult(el);
};

/* Patch result setters dynamically */
[
  "r_emi","r_sip","r_loan","r_gst","r_tax",
  "r_elig","r_bmi","r_age","r_love",
  "r_yt","r_ig","r_ai"
].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    const observer = new MutationObserver(() => animateResult(el));
    observer.observe(el, { childList: true });
  }
});

/* ───────── DEFAULT ACTIVE PANEL SAFETY ───────── */
window.addEventListener("load", () => {
  const first = document.querySelector(".nav-item");
  if (first) first.click();
});

/* ───────── SMALL MOBILE IMPROVEMENT ───────── */
if (window.innerWidth < 640) {
  document.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      document.querySelector(".sidebar").scrollIntoView({
        behavior: "smooth"
      });
    });
  });
}

</script>
<script>

/* ─────────────────────────────
   SIDEBAR CONFIG (ALL CALCS)
─────────────────────────────*/
const CATEGORIES = [
  {
    name: "Finance",
    icon: "💰",
    class: "c-finance",
    items: [
      ["EMI Calculator","p-emi","🏦"],
      ["SIP Calculator","p-sip","📈"],
      ["Loan Interest","p-loan","💳"],
      ["Loan Eligibility","p-eligibility","🏠"]
    ]
  },
  {
    name: "Tax",
    icon: "🧾",
    class: "c-tax",
    items: [
      ["GST Calculator","p-gst","🧾"],
      ["Income Tax","p-tax","🇮🇳"]
    ]
  },
  {
    name: "Health",
    icon: "🧍",
    class: "c-health",
    items: [
      ["BMI Calculator","p-bmi","⚖️"]
    ]
  },
  {
    name: "Utility",
    icon: "🛠️",
    class: "c-utility",
    items: [
      ["Age Calculator","p-age","🎂"],
      ["Student Calculator","p-student","🎓"]
    ]
  },
  {
    name: "Fun",
    icon: "❤️",
    class: "c-fun",
    items: [
      ["Love Calculator","p-love","❤️"]
    ]
  },
  {
    name: "Creator",
    icon: "📸",
    class: "c-creator",
    items: [
      ["YouTube Money","p-yt","📺"],
      ["Instagram Earnings","p-ig","📸"]
    ]
  },
  {
    name: "Tech",
    icon: "🤖",
    class: "c-tech",
    items: [
      ["AI API Cost","p-ai","🤖"]
    ]
  }
];


/* ─────────────────────────────
   BUILD SIDEBAR
─────────────────────────────*/
const sidebar = document.getElementById("sidebar");

CATEGORIES.forEach((cat, ci) => {

  const block = document.createElement("div");
  block.className = `category-block ${cat.class}`;
  block.style.animationDelay = `${ci * 0.08}s`;

  block.innerHTML = `
    <div class="cat-header">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-label">${cat.name}</div>
      <div class="cat-arrow">▶</div>
    </div>
    <div class="cat-items"></div>
  `;

  const itemsWrap = block.querySelector(".cat-items");

  cat.items.forEach(([name,id,emoji], i) => {
    const el = document.createElement("div");
    el.className = "nav-item";
    el.innerHTML = `
      <div class="item-dot"></div>
      <div class="item-emoji">${emoji}</div>
      <div class="item-name">${name}</div>
    `;

    el.onclick = () => openPanel(id, el);

    setTimeout(()=> el.classList.add("visible"), 100 + i*60);

    itemsWrap.appendChild(el);
  });

  block.querySelector(".cat-header").onclick = () => {
    block.classList.toggle("open");
  };

  sidebar.appendChild(block);
});


/* ─────────────────────────────
   PANEL SWITCHING
─────────────────────────────*/
function openPanel(id, el){
  document.querySelectorAll(".calc-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));

  document.getElementById(id).classList.add("active");
  el.classList.add("active");
}


/* ─────────────────────────────
   EMI
─────────────────────────────*/
function calcEMI(){
  let P = +emi-p.value;
  let r = +emi-r.value/12/100;
  let n = +emi-t.value*12;

  let emi = P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  let total = emi*n;
  let interest = total - P;

  rv-emi.innerText = "₹"+emi.toFixed(0);
  rv-emi-total.innerText = "₹"+total.toFixed(0);
  rv-emi-int.innerText = "₹"+interest.toFixed(0);

  r-emi.classList.add("show");
}


/* ─────────────────────────────
   SIP
─────────────────────────────*/
function calcSIP(){
  let m = +sip-m.value;
  let r = +sip-r.value/12/100;
  let n = +sip-t.value*12;

  let fv = m*((Math.pow(1+r,n)-1)/r)*(1+r);

  let invested = m*n;
  let gain = fv - invested;

  rv-sip.innerText = "₹"+fv.toFixed(0);
  rv-sip-inv.innerText = "₹"+invested;
  rv-sip-gain.innerText = "₹"+gain.toFixed(0);

  r-sip.classList.add("show");
}


/* ─────────────────────────────
   LOAN INTEREST
─────────────────────────────*/
function calcLI(){
  let p = +li-p.value;
  let r = +li-r.value/100;
  let t = +li-t.value;

  let interest,total;

  if(li-type.value==="s"){
    interest = p*r*t;
    total = p + interest;
  } else {
    total = p*Math.pow(1+r,t);
    interest = total - p;
  }

  rv-li-int.innerText = "₹"+interest.toFixed(0);
  rv-li-total.innerText = "₹"+total.toFixed(0);

  r-loan.classList.add("show");
}


/* ─────────────────────────────
   GST
─────────────────────────────*/
function calcGST(){
  let a = +gst-a.value;
  let r = +gst-r.value/100;

  let pre, tax, final;

  if(gst-m.value==="add"){
    tax = a*r;
    final = a + tax;
    pre = a;
  } else {
    pre = a/(1+r);
    tax = a - pre;
    final = a;
  }

  rv-gst-pre.innerText = "₹"+pre.toFixed(2);
  rv-gst-tax.innerText = "₹"+tax.toFixed(2);
  rv-gst-post.innerText = "₹"+final.toFixed(2);

  r-gst.classList.add("show");
}

function calcLove(){
  let score = Math.floor(Math.random()*101);

  love-score.innerText = score+"%";
  love-bar.style.width = score+"%";

  r-love.classList.add("show");
}


/* ─────────────────────────────
   AGE
─────────────────────────────*/
function calcAge(){
  let dob = new Date(age-dob.value);
  let today = new Date();

  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if(days<0){ months--; days+=30; }
  if(months<0){ years--; months+=12; }

  rv-age.innerText = `${years}y ${months}m ${days}d`;
  r-age.classList.add("show");
}

─────────────────────────────*/
function calcBMI(){
  let h = +bmi-h.value/100;
  let w = +bmi-w.value;

  let bmi = w/(h*h);

  rv-bmi.innerText = bmi.toFixed(1);
  r-bmi.classList.add("show");
}

  let earnings = views/1000 * rpm;
